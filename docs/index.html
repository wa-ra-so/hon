<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>わたしの本棚</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: #F6EFE3;
    color: #3A2E24;
    min-height: 100vh;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .meta { color: #8A7A68; font-size: 13px; margin-bottom: 20px; }
  .shelf {
    background: #EADFCB;
    border-radius: 4px 4px 0 0;
    min-height: 150px;
    display: flex;
    align-items: flex-end;
    gap: 4px;
    padding: 0 6px;
  }
  .board { height: 14px; background: #8B5E3C; border-radius: 2px; }
  .board-edge { height: 3px; background: #6E4526; margin-bottom: 8px; border-radius: 0 0 2px 2px; }
  .spine {
    border-radius: 2px 2px 0 0;
    display: flex;
    justify-content: center;
    padding-top: 10px;
    overflow: hidden;
    position: relative;
    flex: none;
  }
  .spine::before {
    content: "";
    position: absolute;
    left: 2px; top: 0; bottom: 0;
    width: 2px;
    background: rgba(255,255,255,.25);
  }
  .spine span {
    writing-mode: vertical-rl;
    color: rgba(255,255,255,.92);
    font-size: 11px;
    font-weight: 600;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    max-height: calc(100% - 14px);
  }
  .face {
    width: 82px; height: 122px;
    flex: none;
    border-radius: 2px;
    overflow: hidden;
    box-shadow: 0 2px 4px rgba(0,0,0,.25);
    background: #fff;
  }
  .face img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .face .noimg {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,.95);
    font-size: 12px; font-weight: 700; text-align: center;
    padding: 8px;
  }
  .empty { color: #8A7A68; text-align: center; padding: 60px 0; }
  .footer { margin-top: 32px; text-align: center; color: #8A7A68; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>わたしの本棚</h1>
  <div class="meta" id="meta"></div>
  <div id="shelves"></div>
  <div class="footer">📚 hondana — 読んだ本でつくる本棚</div>
</div>
<script>
(function () {
  var shelves = document.getElementById('shelves');
  var meta = document.getElementById('meta');

  function decode(hash) {
    var m = /[#&]b=([A-Za-z0-9_-]+)/.exec(hash);
    if (!m) return null;
    var b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder('utf-8').decode(bytes));
  }

  function hashStr(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return Math.abs(h);
  }

  var data = null;
  try { data = decode(location.hash); } catch (e) {}

  if (!data || !data.books || !data.books.length) {
    shelves.innerHTML = '<div class="empty">本棚のデータが見つかりませんでした。<br>アプリの「共有」から発行されたリンクを開いてください。</div>';
    return;
  }

  var books = data.books;
  meta.textContent = books.length + '冊';

  var shelfWidth = Math.min(560, window.innerWidth) - 32 - 12;
  var rows = [];
  var row = [];
  var used = 0;
  books.forEach(function (b) {
    var w = b.f ? 82 : 26 + (hashStr(b.t) % 10);
    if (used + w + 4 > shelfWidth && row.length) { rows.push(row); row = []; used = 0; }
    row.push(b);
    used += w + 4;
  });
  if (row.length) rows.push(row);
  while (rows.length < 3) rows.push([]);

  rows.forEach(function (r) {
    var shelf = document.createElement('div');
    shelf.className = 'shelf';
    r.forEach(function (b) {
      var el;
      if (b.f) {
        el = document.createElement('div');
        el.className = 'face';
        if (b.c) {
          var img = document.createElement('img');
          img.src = b.c;
          img.alt = b.t;
          img.referrerPolicy = 'no-referrer';
          el.appendChild(img);
        } else {
          var ph = document.createElement('div');
          ph.className = 'noimg';
          ph.style.background = b.s || '#7B4B3A';
          ph.textContent = b.t;
          el.appendChild(ph);
        }
      } else {
        el = document.createElement('div');
        el.className = 'spine';
        var h = hashStr(b.t);
        el.style.width = (26 + (h % 10)) + 'px';
        el.style.height = (108 + (h % 24)) + 'px';
        el.style.background = b.s || '#7B4B3A';
        var span = document.createElement('span');
        span.textContent = b.t;
        el.appendChild(span);
      }
      var tip = b.t + (b.a ? ' / ' + b.a : '') + (b.r ? ' ' + '★'.repeat(b.r) : '');
      el.title = tip;
      shelf.appendChild(el);
    });
    shelves.appendChild(shelf);
    var board = document.createElement('div');
    board.className = 'board';
    shelves.appendChild(board);
    var edge = document.createElement('div');
    edge.className = 'board-edge';
    shelves.appendChild(edge);
  });
})();
</script>
</body>
</html>
