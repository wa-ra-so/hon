<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>わたしの本棚</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #181310;
    --bg-deep: #120E0B;
    --text: #EFE6D6;
    --muted: #A2917B;
    --faint: #6E6152;
    --brass: #C2985C;
    --star: #D4A94F;
    --hairline: rgba(214,192,158,.14);
  }
  body {
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    background:
      radial-gradient(120% 60% at 50% 0%, rgba(214,170,110,.07), transparent 60%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 40px 20px 72px; }

  .overline {
    color: var(--brass);
    font-size: 10px;
    letter-spacing: .45em;
    font-family: "Helvetica Neue", Arial, sans-serif;
    margin-bottom: 10px;
  }
  h1 { font-size: 26px; font-weight: 600; letter-spacing: .06em; }
  .meta {
    color: var(--muted);
    font-size: 13px;
    margin-top: 8px;
    letter-spacing: .12em;
  }
  .rule {
    height: 1px;
    background: linear-gradient(90deg, var(--brass), rgba(194,152,92,0));
    margin: 22px 0 30px;
  }

  /* ---- 本棚 ---- */
  .case {
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid rgba(0,0,0,.55);
    box-shadow: 0 24px 60px rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.4);
  }
  .cavity {
    height: 172px;
    position: relative;
    display: flex;
    align-items: flex-end;
    gap: 5px;
    padding: 0 10px;
    background: linear-gradient(#332417, #141009 55%, #1E150D);
  }
  .cavity::before {
    /* ダウンライト */
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 58px;
    background: linear-gradient(rgba(240,200,140,.14), rgba(240,200,140,0));
    pointer-events: none;
  }
  .cavity::after {
    /* 足元の落ち影 */
    content: "";
    position: absolute;
    inset: auto 0 0 0;
    height: 14px;
    background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.55));
    pointer-events: none;
  }
  .board {
    height: 16px;
    background:
      repeating-linear-gradient(90deg,
        rgba(255,255,255,.03) 0 2px, rgba(0,0,0,0) 2px 7px),
      linear-gradient(#6B4C31, #3E2B1C 45%, #241609);
    border-top: 1px solid rgba(255,220,170,.28);
  }

  /* ---- 背表紙 ---- */
  .spine {
    position: relative;
    flex: none;
    z-index: 1;
    border-radius: 2px 2px 0 0;
    display: flex;
    justify-content: center;
    padding-top: 12px;
    overflow: hidden;
    box-shadow: 2px 2px 3px rgba(0,0,0,.5);
    cursor: default;
  }
  .spine.lean {
    transform: rotate(-3.5deg);
    transform-origin: bottom left;
    margin-right: 3px;
  }
  .spine i {
    /* 天の小口 */
    position: absolute;
    top: 0; left: 3px; right: 3px;
    height: 3px;
    background: rgba(255,250,235,.28);
    border-radius: 1px;
  }
  .spine span {
    color: rgba(255,252,244,.92);
    font-size: 11px;
    line-height: 13px;
    font-weight: 600;
    text-align: center;
    white-space: pre-line;
    overflow: hidden;
  }
  .spine b {
    position: absolute;
    bottom: 5px; left: 0; right: 0;
    text-align: center;
    color: var(--star);
    font-size: 8px;
    font-weight: normal;
  }

  /* ---- 面置き ---- */
  .face {
    position: relative;
    width: 86px; height: 128px;
    flex: none;
    z-index: 1;
    border-radius: 2px;
    overflow: hidden;
    background: #221B15;
    box-shadow: 3px 4px 6px rgba(0,0,0,.6);
  }
  .face::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(rgba(255,255,255,.16), rgba(255,255,255,.02) 40%, rgba(0,0,0,.18));
    pointer-events: none;
  }
  .face::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: rgba(0,0,0,.35);
    z-index: 1;
  }
  .face img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .face .noimg {
    position: absolute;
    inset: 7px;
    border: 1px solid rgba(255,248,230,.35);
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,250,238,.95);
    font-size: 12px;
    font-weight: 700;
    text-align: center;
    letter-spacing: .08em;
    padding: 6px;
  }

  .empty {
    color: var(--muted);
    text-align: center;
    padding: 80px 0;
    line-height: 2;
    letter-spacing: .1em;
  }
  .footer {
    margin-top: 40px;
    text-align: center;
    color: var(--faint);
    font-size: 11px;
    letter-spacing: .3em;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="overline">MY LIBRARY</div>
  <h1>わたしの本棚</h1>
  <div class="meta" id="meta"></div>
  <div class="rule"></div>
  <div id="shelves"></div>
  <div class="footer">HONDANA</div>
</div>
<script>
(function () {
  var shelvesEl = document.getElementById('shelves');
  var meta = document.getElementById('meta');

  function decode(hash) {
    var m = /[#&]b=([A-Za-z0-9_-]+)/.exec(hash);
    if (!m) return null;
    var b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder('utf-8').decode(bytes));
  }

  function hashStr(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return Math.abs(h);
  }

  function shadeHex(hex, amount) {
    var n = parseInt(hex.slice(1), 16);
    function c(v) { return Math.max(0, Math.min(255, Math.round(v))); }
    var r = c(((n >> 16) & 255) * (1 + amount));
    var g = c(((n >> 8) & 255) * (1 + amount));
    var b = c((n & 255) * (1 + amount));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  var data = null;
  try { data = decode(location.hash); } catch (e) {}

  if (!data || !data.books || !data.books.length) {
    shelvesEl.innerHTML = '<div class="empty">本棚のデータが見つかりませんでした。<br>アプリの「共有」から発行されたリンクを開いてください。</div>';
    return;
  }

  var books = data.books;
  meta.textContent = books.length + ' 冊の蔵書';

  var shelfWidth = Math.min(560, window.innerWidth) - 40 - 22;
  var rows = [];
  var row = [];
  var used = 0;
  books.forEach(function (b, i) {
    var w = b.f ? 86 : 27 + (hashStr(b.t) % 11);
    if (used + w + 5 > shelfWidth && row.length) { rows.push(row); row = []; used = 0; }
    row.push({ b: b, i: i });
    used += w + 5;
  });
  if (row.length) rows.push(row);
  while (rows.length < 3) rows.push([]);

  var caseEl = document.createElement('div');
  caseEl.className = 'case';

  rows.forEach(function (r) {
    var cavity = document.createElement('div');
    cavity.className = 'cavity';
    r.forEach(function (item) {
      var b = item.b;
      var el;
      if (b.f) {
        el = document.createElement('div');
        el.className = 'face';
        if (b.c) {
          var img = document.createElement('img');
          img.src = b.c;
          img.alt = b.t;
          img.referrerPolicy = 'no-referrer';
          el.appendChild(img);
        } else {
          var ph = document.createElement('div');
          ph.className = 'noimg';
          ph.textContent = b.t;
          el.style.background = b.s || '#5E4B3B';
          el.appendChild(ph);
        }
      } else {
        el = document.createElement('div');
        el.className = 'spine' + (item.i % 6 === 4 ? ' lean' : '');
        var h = hashStr(b.t);
        var base = b.s || '#5E4B3B';
        el.style.width = (27 + (h % 11)) + 'px';
        el.style.height = (112 + (h % 30)) + 'px';
        el.style.background = 'linear-gradient(90deg, ' +
          shadeHex(base, 0.22) + ', ' + base + ' 45%, ' + shadeHex(base, -0.38) + ')';
        var edge = document.createElement('i');
        el.appendChild(edge);
        var span = document.createElement('span');
        var height = 112 + (h % 30);
        var maxChars = Math.floor((height - 12 - 8 - (b.r === 5 ? 14 : 0)) / 13);
        var chars = Array.from(b.t);
        if (chars.length > maxChars) chars = chars.slice(0, maxChars - 1).concat('…');
        span.textContent = chars.join('\n');
        el.appendChild(span);
        if (b.r === 5) {
          var star = document.createElement('b');
          star.textContent = '★';
          el.appendChild(star);
        }
      }
      el.title = b.t + (b.a ? ' / ' + b.a : '') + (b.r ? '　' + '★'.repeat(b.r) : '');
      cavity.appendChild(el);
    });
    caseEl.appendChild(cavity);
    var board = document.createElement('div');
    board.className = 'board';
    caseEl.appendChild(board);
  });

  shelvesEl.appendChild(caseEl);
})();
</script>
</body>
</html>
